<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula Grid 02</title>
    <style>
        * {
            font-family: Arial, Helvetica, sans-serif;
        }
        .conteiner {
            border: 2px solid blue;
            height: 130px;
            padding: 5px;
            display: grid;
            grid-template-columns: auto auto auto;
            grid-template-rows: auto auto auto;
            gap: 5px;
        }

        .filho {
            border: 2px dashed red;
            padding: 5px;
        }

        #c1 {align-items: end;}
        #c2 {justify-items: start;}
        #c3 {align-content: space-between;}
        #c4 {justify-content: space-evenly;}

    </style>
</head>
<body>
    <p>align-items: end;</p>
    <div id="c1" class="conteiner">
        <div class="filho">A</div>
        <div class="filho">B</div>
        <div class="filho">C</div>
        <div class="filho">D</div>
        <div class="filho">E</div>
        <div class="filho">F</div>
        <div class="filho">G</div>
    </div>
    <p>justify-items: start;</p>
    <div id="c2" class="conteiner">
        <div class="filho">A</div>
        <div class="filho">B</div>
        <div class="filho">C</div>
        <div class="filho">D</div>
        <div class="filho">E</div>
        <div class="filho">F</div>
        <div class="filho">G</div>
    </div>
    <p>align-content: space-between</p>
    <div id="c3" class="conteiner">
        <div class="filho">A</div>
        <div class="filho">B</div>
        <div class="filho">C</div>
        <div class="filho">D</div>
        <div class="filho">E</div>
        <div class="filho">F</div>
        <div class="filho">G</div>
    </div>
    <p>justify-content: space-evenly;</p>
    <div id="c4" class="conteiner">
        <div class="filho">A</div>
        <div class="filho">B</div>
        <div class="filho">C</div>
        <div class="filho">D</div>
        <div class="filho">E</div>
        <div class="filho">F</div>
        <div class="filho">G</div>
    </div>
</body>
</html>
