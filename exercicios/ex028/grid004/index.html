<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula Grid 02</title>
    <style>
        .conteiner {
            border: 2px solid blue;
            padding: 5px;
            display: grid;
            grid-template: repeat(3, 100px) / 1fr 5fr 1fr;
            /*grid-template-columns: auto auto auto;
            grid-template-rows: auto auto auto;*/
            gap: 5px;
            grid-auto-rows: 100px;
            grid
        }

        .filho {
            border: 2px dashed red;
            padding: 5px;
        }

    </style>
</head>
<body>
    <div class="conteiner">
        <div class="filho">A</div>
        <div class="filho">B</div>
        <div class="filho">C</div>
        <div class="filho">D</div>
        <div class="filho">E</div>
        <div class="filho">F</div>
        <div class="filho">G</div>
        <div class="filho">H</div>
        <div class="filho">I</div>
        <div class="filho">J</div>
    </div>
</body>
</html>
